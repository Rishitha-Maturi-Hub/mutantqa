[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mutantqa"
version = "0.1.0"
description = "QA for LLM apps: generated test suites, mutation testing, flakiness detection and statistically honest CI gates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rishitha Maturi" }]
keywords = ["llm", "evaluation", "testing", "rag", "qa", "mutation-testing", "ci"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "pyyaml>=6",
  "litellm>=1.40",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Better embeddings for dedupe/retrieval. Without it, a hashing TF-IDF fallback is used.
embeddings = ["sentence-transformers>=2.7"]
dashboard = ["streamlit>=1.35", "pandas>=2"]
demo = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "statsmodels>=0.14", "build", "twine", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
mutantqa = "mutantqa.cli:app"

[project.urls]
Homepage = "https://github.com/Rishitha Maturi/mutantqa"

[tool.setuptools.packages.find]
include = ["mutantqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import demo_app, which isn't part of the installed package
