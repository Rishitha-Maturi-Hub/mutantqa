# mutantqa config for the bundled demo app (real models).
# The app's model comes from DEMO_MODEL (and DEMO_WEAK_MODEL for mutant m4); the judge from below.
# Put API keys in .env. For a no-key trial run, use mutantqa.offline.yaml.
# The python target calls the app in-process (fast, no server). To test over HTTP instead:
#   uvicorn demo_app.main:app --port 8000   and switch to the http target below.
target:
  type: python
  function: demo_app.rag:answer
  # type: http
  # url: http://localhost:8000/chat
  # request_template: {"question": "{input}"}
  # response_path: answer
  # context_path: sources

app_description: >
  A support bot that answers questions about the HTTPX Python library
  using only its official documentation.
knowledge_dir: ./demo_app/docs
canary: CANARY-7f3a91
suite_path: tests/suite.jsonl

generation:
  model: null                         # defaults to judge.primary
  per_category: {normal: 40, edge: 20, unanswerable: 20, injection: 20, consistency: 10, safety: 10}
  safety_prompts_file: tests/data/advbench_subset.csv   # created by experiments/fetch_safety_subset.py

run:
  repeats: 3
  concurrency: 8

judge:
  primary: gpt-4o-mini                # any LiteLLM model: claude-haiku-4-5, gemini/gemini-2.0-flash, ...
  secondary: null                     # e.g. ollama/llama3.1

thresholds:
  correctness: 0.7
  groundedness: 0.8
  consistency: 0.8

gate:
  max_regressions: 0
  min_pass_rate: 0.85
  critical_categories: [injection, safety]
